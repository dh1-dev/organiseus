<style>

5px;margin:0 0 6px}.desc{font-size:13px;color:#59606a}.chips,.actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.chip{font-size:11px;background:#eef1f4;padding:4px 6px;border-radius:999px}.actions button{font-size:12px;padding:6px 8px}.empty{color:#777;font-size:13px;padding:8px}.panel{background:var(--panel);border:1px solid #dfe3e8;border-radius:12px;padding:12px;margin-bottom:11px}.voice-row{display:flex;gap:8px}.voice-row input{flex:1}.modal{position:fixed;inset:0;background:#0008;z-index:20;padding:12px;overflow:auto}.box{background:#fff;max-width:650px;margin:25px auto;border-radius:15px;padding:15px}.head{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0}.field{display:block;margin-top:10px}.field span{font-size:12px;color:#555;display:block;margin-bottom:4px}input,select,textarea{width:100%;padding:10px;border:1px solid #cfd5dc;border-radius:9px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:9px;z-index:40}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f3f7}.login-card{width:min(420px,100%);background:#fff;border:1px solid #ddd;border-radius:18px;padding:20px}.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:16px}.login-brand h1{margin:0}.error{color:#a51616;font-size:13px;margin-top:9px}.userbar{display:flex;align-items:center;gap:8px;font-size:12px;color:#667}.userbar button{padding:6px 9px;font-size:12px}.sync{font-size:11px;color:#667;text-align:right;margin-bottom:8px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:linear-gradient(90deg,#f9f8fb,#eceaf0);border-top:1px solid #dfe3e8;padding:7px max(12px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.nav-btn{border:0;background:transparent;border-radius:12px;padding:7px 8px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#6a7079;font-size:10px;font-weight:700}.nav-btn svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nav-btn.active{background:#e9e1f5;color:#65449f}
@media(max-width:700px){.grid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar input{min-width:100%}.toolbar button{flex:1}}
</style>
</head><body>
<div id="loginView" class="login">
 <div class="login-card"><div class="login-brand"><svg class="logo" viewBox="0 0 64 64"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8d8df"/><stop offset=".45" stop-color="#9c82c8"/><stop offset="1" stop-color="#5e3c96"/></linearGradient></defs><rect x="4" y="4" width="56" height="56" rx="16" fill="url(#g1)"/><path d="M19 33.5l8 8L45 22.5" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>OrganiseUs</h1></div>
 <form id="loginForm"><label class="field"><span>Email</span><input id="email" type="email" required autocomplete="username"></label><label class="field"><span>Password</span><input id="password" type="password" required autocomplete="current-password"></label><button id="loginBtn" class="primary" style="width:100%;margin-top:14px">Sign in</button><div id="loginError" class="error"></div></form></div>
</div>
<div id="appView" class="hidden">
<header class="header"><div class="brand"><svg class="logo" viewBox="0 0 64 64"><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8d8df"/><stop offset=".45" stop-color="#9c82c8"/><stop offset="1" stop-color="#5e3c96"/></linearGradient></defs><rect x="4" y="4" width="56" height="56" rx="16" fill="url(#g2)"/><path d="M19 33.5l8 8L45 22.5" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><div><h1>OrganiseUs</h1><small id="today"></small></div></div><div class="userbar"><span id="signedIn"></span><button id="signOut">Sign out</button></div></header>
<main class="wrap"><div id="syncText" class="sync">Connecting…</div><div id="tabs" class="tabs"></div><div class="toolbar"><input id="search" placeholder="Search tasks"><button id="addBtn" class="primary">＋ Add task</button><button id="voiceBtn">🎙 Voice</button></div><div id="voicePanel" class="panel hidden"><b>Voice command</b><p id="voiceMessage">Type or dictate a command.</p><div class="voice-row"><input id="voiceInput" placeholder="Add a task for Sarah to book the dentist tomorrow"><button id="runVoice" class="primary">Run</button></div><div class="actions"><button id="listen">Start listening</button><button id="closeVoice">Close</button></div></div><div id="summary" class="summary"></div><div id="board" class="board"></div></main>
<nav class="bottom-nav" aria-label="Task navigation">
<button id="meBtn" class="nav-btn active" aria-label="My tasks"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path></svg><span>Me</span></button>
<button id="othersBtn" class="nav-btn" aria-label="Other people's tasks"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M2.5 21a6.5 6.5 0 0 1 13 0"></path><path d="M14 16.2a5 5 0 0 1 7.5 4.3"></path></svg><span>Others</span></button>
</nav></div>
<div id="modal" class="modal hidden"><div class="box"><div class="head"><h2 id="modalTitle">Add task</h2><button id="closeModal">✕</button></div><form id="taskForm"><input id="taskId" type="hidden"><label class="field"><span>Title</span><input id="title" required maxlength="150"></label><label class="field"><span>Description</span><textarea id="description" rows="3"></textarea></label><div class="grid"><label class="field"><span>Area</span><select id="area"><option value="personal">Personal</option><option value="work">Work</option></select></label><label class="field"><span>Owner</span><select id="owner"></select></label><label class="field"><span>Status</span><select id="status"><option value="todo">To do</option><option value="progress">In progress</option><option value="done">Done</option></select></label><label class="field"><span>Due date</span><input id="due" type="date"></label><label class="field"><span>Repeats</span><select id="repeat"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></label><label class="field"><span>Priority</span><select id="priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></label></div><div class="modal-actions"><button type="button" id="delete" class="danger hidden">Delete</button><button type="button" id="cancel">Cancel</button><button type="submit" class="primary">Save task</button></div></form></div></div>
<div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const URL='https://meaakswalvliphlexqqd.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lYWFrc3dhbHZsaXBobGV4cXFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDE5NzUsImV4cCI6MjEwMDkxNzk3NX0.TQulUFAumLl7V-9Rw6Tm5Vreyp2SyRA8BnYyIdZNyqU';
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let user=null, householdId=null, people=[], tasks=[], mePerson=null, mode='me', meArea='personal', otherId=null, channel=null, selectedStatus='todo';
const $=id=>document.getElementById(id); const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML};
function notify(m){$('toast').textContent=m;$('toast').className='toast';clearTimeout(notify.t);notify.t=setTimeout(()=>$('toast').className='toast hidden',2400)}
function fmt(s){if(!s)return'';let p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function person(id){return people.find(p=>p.id===id)}
function current(){let q=$('search').value.toLowerCase();return tasks.filter(t=>{let ok=mode==='me'?(t.owner_person_id===mePerson.id&&t.area===meArea):t.owner_person_id===otherId;let txt=(t.title+' '+(t.description||'')+' '+(person(t.owner_person_id)?.name||'')+' '+t.area).toLowerCase();return ok&&(!q||txt.includes(q))})}
function otherPeople(){return people.filter(p=>p.id!==mePerson.id).sort((a,b)=>{let o={Sarah:1,Dan:2,Milo:3};return (o[a.name]||99)-(o[b.name]||99)})}
function renderTabs(){let h='';if(mode==='me'){h=`<button class="${meArea==='personal'?'active':''}" data-a="personal">Personal</button><button class="${meArea==='work'?'active':''}" data-a="work">Work</button>`}else{for(const p of otherPeople())h+=`<button class="${otherId===p.id?'active':''}" data-p="${p.id}">${esc(p.name)}</button>`}$('tabs').innerHTML=h;document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.a)meArea=b.dataset.a;else otherId=b.dataset.p;selectedStatus='todo';render()})}
function render(){if(!mePerson)return;renderTabs();$('meBtn').className='nav-btn'+(mode==='me'?' active':'');$('othersBtn').className='nav-btn'+(mode==='others'?' active':'');let list=current(),c={todo:0,progress:0,done:0};list.forEach(t=>c[t.status]++);let names={todo:'To do',progress:'In progress',done:'Done'};$('summary').innerHTML=['todo','progress','done'].map(s=>`<button class="sum ${selectedStatus===s?'active':''}" data-status="${s}"><b>${c[s]}</b><span>${names[s]}</span></button>`).join('');document.querySelectorAll('#summary .sum').forEach(b=>b.onclick=()=>{selectedStatus=b.dataset.status;render()});let cards=list.filter(t=>t.status===selectedStatus).map(card).join('');$('board').innerHTML=`<section class="column"><h2>${names[selectedStatus]}</h2>${cards||'<div class="empty">No tasks</div>'}</section>`;document.querySelectorAll('.card').forEach(c=>c.onclick=e=>{let a=e.target.dataset.action;if(!a)return;let id=c.dataset.id;if(a==='edit')openTask(id);else updateStatus(id,a)})}
function card(t){let p=person(t.owner_person_id);return `<article class="card" data-id="${t.id}"><h3>${esc(t.title)}</h3>${t.description?`<div class="desc">${esc(t.description)}</div>`:''}<div class="chips">${mode==='others'?`<span class="chip">${esc(t.area)}</span>`:''}${p&&p.id!==mePerson.id?`<span class="chip">${esc(p.name)}</span>`:''}${t.due_date?`<span class="chip">Due ${fmt(t.due_date)}</span>`:''}${t.repeat_rule!=='none'?`<span class="chip">${t.repeat_rule}</span>`:''}</div><div class="actions"><button data-action="edit">Edit</button>${t.status!=='todo'?'<button data-action="todo">To do</button>':''}${t.status!=='progress'?'<button data-action="progress">In progress</button>':''}${t.status!=='done'?'<button data-action="done">Done</button>':''}</div></article>`}
async function loadData(){const m=await sb.from('household_members').select('household_id').eq('user_id',user.id).single();if(m.error)throw m.error;householdId=m.data.household_id;const [pp,tt]=await Promise.all([sb.from('people').select('*').eq('household_id',householdId),sb.from('tasks').select('*').eq('household_id',householdId).order('created_at',{ascending:true})]);if(pp.error)throw pp.error;if(tt.error)throw tt.error;people=pp.data;tasks=tt.data;mePerson=people.find(p=>p.user_id===user.id);if(!mePerson)throw new Error('No person is linked to this login');let others=otherPeople();if(!otherId||!others.some(p=>p.id===otherId))otherId=others[0]?.id;$('syncText').textContent='Synced';render();subscribe()}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('organiseus-'+householdId).on('postgres_changes',{event:'*',schema:'public',table:'tasks',filter:'household_id=eq.'+householdId},()=>loadData()).subscribe()}
function owners(selected){$('owner').innerHTML=people.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('')}
function openTask(id){let t=tasks.find(x=>x.id===id),ownerId=t?t.owner_person_id:(mode==='others'?otherId:mePerson.id);$('modalTitle').textContent=t?'Edit task':'Add task';$('taskId').value=t?.id||'';$('title').value=t?.title||'';$('description').value=t?.description||'';$('area').value=t?.area||(mode==='me'?meArea:'personal');owners(ownerId);$('status').value=t?.status||'todo';$('due').value=t?.due_date||'';$('repeat').value=t?.repeat_rule||'none';$('priority').value=t?.priority||'normal';$('delete').className=t?'danger':'danger hidden';$('modal').className='modal'}
function closeModal(){$('modal').className='modal hidden'}
async function saveTask(e){e.preventDefault();let id=$('taskId').value,owner=person($('owner').value),area=$('area').value;if(area==='work'&&owner.user_id!==user.id){notify('Work tasks can only be assigned to yourself');return}let row={household_id:householdId,owner_person_id:owner.id,owner_user_id:owner.user_id||null,title:$('title').value.trim(),description:$('description').value.trim(),area,status:$('status').value,due_date:$('due').value||null,repeat_rule:$('repeat').value,priority:$('priority').value,monitoring:owner.id!==mePerson.id};let r=id?await sb.from('tasks').update(row).eq('id',id):await sb.from('tasks').insert(row);if(r.error){notify(r.error.message);return}closeModal();notify(id?'✓ Task updated':'✓ Task added');await loadData()}
async function updateStatus(id,status){let r=await sb.from('tasks').update({status}).eq('id',id);if(r.error)notify(r.error.message);else{notify('Task updated');await loadData()}}
async function removeTask(){if(!confirm('Delete this task?'))return;let r=await sb.from('tasks').delete().eq('id',$('taskId').value);if(r.error)notify(r.error.message);else{closeModal();notify('Task deleted');await loadData()}}
function parseCommand(raw){let t=raw.trim().replace(/[.!?]+$/,'');let low=t.toLowerCase(),area=/\bwork\b/.test(low)?'work':'personal',due=null,repeat='none',owner=mePerson;if(/\btomorrow\b/.test(low)){let d=new Date();d.setDate(d.getDate()+1);due=d.toISOString().slice(0,10)}else if(/\btoday\b/.test(low))due=new Date().toISOString().slice(0,10);if(/daily|every day/.test(low))repeat='daily';else if(/weekly|every week/.test(low))repeat='weekly';else if(/monthly|every month/.test(low))repeat='monthly';else if(/yearly|annually|every year/.test(low))repeat='yearly';let pm=t.match(/\bfor\s+([A-Za-z][A-Za-z' -]*?)(?=\s+to\s+|\s+(today|tomorrow|every|daily|weekly|monthly|yearly|annually)\b|$)/i);if(pm){let found=people.find(p=>p.name.toLowerCase()===pm[1].trim().toLowerCase());if(!found)return {unknown:pm[1].trim()};owner=found}let title=t.replace(/^\s*(please\s+)?(add|create|make)\s+(me\s+)?(a\s+)?/i,'').replace(/^\s*(personal|work)\s+/i,'').replace(/^\s*task\s+(to\s+)?/i,'').replace(/^\s*remind me to\s+/i,'').replace(/\bfor\s+[A-Za-z][A-Za-z' -]*?\s+to\s+/i,'').replace(/\b(today|tomorrow|every day|daily|every week|weekly|every month|monthly|every year|yearly|annually)\b/ig,'').replace(/^\s*(a\s+)?(personal|work)\s+task\s+(to\s+)?/i,'').replace(/\s+/g,' ').trim();return {title:title.charAt(0).toUpperCase()+title.slice(1),area,due,repeat,owner}}
async function voiceRun(){let raw=$('voiceInput').value.trim();if(!raw)return notify('Type or dictate a command');let done=raw.match(/(.+?)\s+(is|are)?\s*(now)?\s*done$/i);if(done){let names=done[1].split(/\s+and\s+|,/),hits=[];for(const n of names){let t=tasks.find(x=>x.status!=='done'&&x.title.toLowerCase().includes(n.trim().toLowerCase()));if(t){await sb.from('tasks').update({status:'done'}).eq('id',t.id);hits.push(t.title)}}if(hits.length){$('voiceInput').value='';$('voiceMessage').textContent='Completed: '+hits.join(', ');notify('✓ Completed');await loadData()}else notify('No matching task');return}if(!/^(please\s+)?(add|create|make)\b/i.test(raw)&&!/^remind me to\b/i.test(raw))return notify('Command not understood');let p=parseCommand(raw);if(p.unknown)return notify(p.unknown+' is not in your People list');if(!p.title)return notify('Task title not recognised');if(p.area==='work'&&p.owner.user_id!==user.id)return notify('Work tasks can only be for yourself');let r=await sb.from('tasks').insert({household_id:householdId,owner_person_id:p.owner.id,owner_user_id:p.owner.user_id||null,title:p.title,description:'',area:p.area,status:'todo',due_date:p.due,repeat_rule:p.repeat,priority:'normal',monitoring:p.owner.id!==mePerson.id});if(r.error)notify(r.error.message);else{$('voiceInput').value='';$('voiceMessage').textContent='Task added: “'+p.title+'”';notify('✓ Task added');await loadData()}}
function listen(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return $('voiceMessage').textContent='Use your keyboard microphone.';let r=new SR();r.lang='en-GB';r.onresult=e=>{$('voiceInput').value=e.results[0][0].transcript;voiceRun()};r.onerror=()=>$('voiceMessage').textContent='Use your keyboard microphone.';r.start()}
async function login(e){e.preventDefault();$('loginBtn').disabled=true;$('loginError').textContent='';let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;if(r.error)$('loginError').textContent=r.error.message}
async function init(){let {data:{session}}=await sb.auth.getSession();handleSession(session);sb.auth.onAuthStateChange((_e,s)=>handleSession(s))}
async function handleSession(session){if(!session){user=null;$('loginView').className='login';$('appView').className='hidden';return}user=session.user;$('loginView').className='hidden';$('appView').className='';$('signedIn').textContent=user.email;$('today').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});try{await loadData()}catch(e){$('syncText').textContent='Sync error';notify(e.message)}}
$('loginForm').onsubmit=login;$('signOut').onclick=()=>sb.auth.signOut();$('meBtn').onclick=()=>{mode='me';selectedStatus='todo';render()};$('othersBtn').onclick=()=>{mode='others';selectedStatus='todo';render()};$('search').oninput=render;$('addBtn').onclick=()=>openTask();$('voiceBtn').onclick=()=>$('voicePanel').className='panel';$('closeVoice').onclick=()=>$('voicePanel').className='panel hidden';$('runVoice').onclick=voiceRun;$('listen').onclick=listen;$('taskForm').onsubmit=saveTask;$('closeModal').onclick=closeModal;$('cancel').onclick=closeModal;$('delete').onclick=removeTask;if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');init();
})();
</script></body></html>
