name: Cleaning tasks always personal
on:
  push:
    paths:
      - '.github/workflows/cleaning-always-personal.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide area for cleaning tasks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old='<label class="field"><span>Area</span><select id="area"><option value="personal">Personal</option><option value="work">Work</option></select></label>'
          new='<label id="areaField" class="field"><span>Area</span><select id="area"><option value="personal">Personal</option><option value="work">Work</option></select></label>'
          if old not in s:
              raise SystemExit('Area field not found')
          s=s.replace(old,new,1)

          start=s.index('function updateCategoryVisibility(){')
          end=s.index('\nfunction openTask',start)
          replacement="""function updateCategoryVisibility(){const selectedClean=$('category').value==='cleaning';if(selectedClean)$('area').value='personal';const isWork=$('area').value==='work';$('categoryField').className=isWork?'field hidden':'field';if(isWork)$('category').value='general';if($('category').value==='activity')$('category').value='general';const clean=!isWork&&$('category').value==='cleaning';$('areaField').className=clean?'field hidden':'field';$('repeatField').className=clean?'field hidden':'field';$('cleaningFields').className=clean?'cleaning-fields':'cleaning-fields hidden';if(clean){if($('cleaningRepeat').value==='weekly'&&!$('cleaningRepeatDay').value)$('cleaningRepeatDay').value='5';$('repeat').value=$('cleaningRepeat').value;$('cleaningRepeatDayField').className=$('cleaningRepeat').value==='weekly'?'field':'field hidden';if($('cleaningRepeat').value==='weekly'){let day=Number($('cleaningRepeatDay').value),current=$('due').value;if(!current||parseLocalDate(current).getDay()!==day)$('due').value=nextWeekday(day,new Date(),true)}}else{$('cleaningRepeatDayField').className='field hidden'}}"""
          s=s[:start]+replacement+s[end:]

          # Safety net: saving a cleaning task can never persist as Work.
          needle="let repeat=clean?$('cleaningRepeat').value:$('repeat').value"
          if needle not in s:
              raise SystemExit('saveTask repeat anchor not found')
          s=s.replace(needle,"if(clean)area='personal';let repeat=clean?$('cleaningRepeat').value:$('repeat').value",1)

          s=s.replace('data-build="3.4-live-cleaning-search"','data-build="3.5-cleaning-always-personal"')
          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>')[-1].split('</script>',1)[0]
          Path('/tmp/organiseus-app.js').write_text(js)
          PY
          node --check /tmp/organiseus-app.js

      - name: Commit
        run: |
          git config user.name "OrganiseUs updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Make cleaning tasks always personal" || exit 0
          git push
