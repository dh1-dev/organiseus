name: Sort cleaning tasks
on:
  push:
    paths:
      - '.github/workflows/add-more-cleaning-tasks.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sort cleaning presets alphabetically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast,re
          p=Path('index.html')
          s=p.read_text()
          m=re.search(r'const CLEANING_PRESETS=(\[.*?\])\nconst DAY_NAMES=',s,re.S)
          if not m:
              raise SystemExit('Cleaning preset list not found')
          items=ast.literal_eval(m.group(1))
          items=sorted(items,key=lambda x:x[1].casefold())
          rendered='['+','.join(repr(x) for x in items)+']'
          s=s[:m.start(1)]+rendered+s[m.end(1):]
          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>')[-1].split('</script>',1)[0]
          Path('/tmp/organiseus-app.js').write_text(js)
          PY
          node --check /tmp/organiseus-app.js
      - name: Commit
        run: |
          git config user.name "OrganiseUs updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Sort cleaning presets alphabetically" || exit 0
          git push
