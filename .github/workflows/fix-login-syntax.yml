name: Fix OrganiseUs sign-in syntax
on:
  push:
    paths:
      - '.github/workflows/fix-login-syntax.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix extra brace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function populateCleaningPresets(){if($('cleaningPreset').options.length>1)return;for(const [icon,name] of CLEANING_PRESETS){let o=document.createElement('option');o.value=name;o.textContent=icon+' '+name;$('cleaningPreset').appendChild(o)}}}"
          new="function populateCleaningPresets(){if($('cleaningPreset').options.length>1)return;for(const [icon,name] of CLEANING_PRESETS){let o=document.createElement('option');o.value=name;o.textContent=icon+' '+name;$('cleaningPreset').appendChild(o)}}"
          if old not in s:
              raise SystemExit('Expected syntax error not found')
          s=s.replace(old,new,1)
          s=s.replace('data-build="3.1-cleaning-presets-icons"','data-build="3.1.1-cleaning-presets-icons-fix"')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "OrganiseUs updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix OrganiseUs sign-in syntax" || exit 0
          git push
