name: Add OrganiseUs category icons
on:
  push:
    paths:
      - '.github/workflows/add-category-icons.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add category icons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements={
            '<button data-category="house">House</button>':'<button data-category="house">🏠 House</button>',
            '<button data-category="car">Car</button>':'<button data-category="car">🚗 Car</button>',
            '<button data-category="money">Money</button>':'<button data-category="money">💷 Money</button>',
            '<button data-category="general">General</button>':'<button data-category="general">📋 General</button>',
            '<option value="general">General</option>':'<option value="general">📋 General</option>',
            '<option value="house">House</option>':'<option value="house">🏠 House</option>',
            '<option value="car">Car</option>':'<option value="car">🚗 Car</option>',
            '<option value="money">Money</option>':'<option value="money">💷 Money</option>',
            "const CATEGORY_LABELS={house:'House',car:'Car',money:'Money',general:'General',cleaning:'🧹 Cleaning'};":"const CATEGORY_LABELS={house:'🏠 House',car:'🚗 Car',money:'💷 Money',general:'📋 General',cleaning:'🧹 Cleaning'};",
            'data-build="2.8-task-form-cleanup"':'data-build="2.9-category-icons"'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('Missing expected text: '+old)
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "OrganiseUs updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add category icons" || exit 0
          git push
