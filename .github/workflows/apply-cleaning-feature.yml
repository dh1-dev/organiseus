name: Apply OrganiseUs cleaning feature
on:
  push:
    paths:
      - '.github/workflows/apply-cleaning-feature.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path=Path('index.html')
          s=path.read_text()

          def must(old,new,count=1):
              global s
              if old not in s:
                  raise SystemExit('Missing expected text: '+old[:120])
              s=s.replace(old,new,count)

          # UI/CSS
          must('.chip.category{background:#eee8f8;color:#5b3d98}', '.chip.category{background:#eee8f8;color:#5b3d98}.cleaning-points{background:#f7f3fb;border:1px solid #dacdeb;border-radius:12px;padding:10px 12px;margin:0 0 10px}.cleaning-points-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#655d6e;margin-bottom:7px}.cleaning-points-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.cleaning-person{background:#fff;border:1px solid #e1d9ea;border-radius:10px;padding:8px;text-align:center}.cleaning-person b{display:block;font-size:20px;color:#5b3d98}.cleaning-person span{font-size:11px;color:#667}.cleaning-fields{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px;border:1px solid #e1d5ef;border-radius:11px;background:#faf7fd}.cleaning-fields .field{margin-top:0}.cleaning-hint{grid-column:1/-1;font-size:11px;color:#6d6575}.cleaning-card{border-left:4px solid #8f73c7}.task-title-row{display:flex;align-items:center;gap:7px}.task-type-icon{width:25px;height:25px;display:inline-grid;place-items:center;background:#eee8f8;border-radius:8px;flex:0 0 auto}.points-chip{background:#eee8f8;color:#5b3d98;font-weight:700}@media(max-width:520px){.cleaning-fields{grid-template-columns:1fr}.cleaning-points-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}')
          must('<button data-category="general">General</button></div><div class="toolbar">', '<button data-category="general">General</button><button data-category="cleaning">🧹 Cleaning</button></div><div id="cleaningPoints" class="cleaning-points hidden"></div><div class="toolbar">')
          must('<option value="activity">Activity</option></select></label><label class="field"><span>Priority</span>', '<option value="activity">Activity</option><option value="cleaning">🧹 Cleaning</option></select></label><div id="cleaningFields" class="cleaning-fields hidden"><label class="field"><span>Typical cleaning task</span><select id="cleaningPreset"><option value="">Choose a task…</option></select></label><label class="field"><span>Points</span><input id="cleaningPointsValue" type="number" min="1" max="100" step="1" value="5"></label><label class="field"><span>Frequency</span><select id="cleaningRepeat"><option value="daily">Daily</option><option value="weekly" selected>Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></label><label id="cleaningRepeatDayField" class="field"><span>Day</span><select id="cleaningRepeatDay"><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5" selected>Friday</option><option value="6">Saturday</option><option value="0">Sunday</option></select></label><div class="cleaning-hint">Choose a typical task or type your own title. Points are awarded to the owner when the cleaning task is completed.</div></div><label class="field"><span>Priority</span>')

          # State + helpers
          must("let user=null, householdId=null, people=[], tasks=[], events=[], shoppingItems=[], shoppingList=[], movies=[], mePerson=null", "let user=null, householdId=null, people=[], tasks=[], events=[], shoppingItems=[], shoppingList=[], movies=[], cleaningPointsLog=[], mePerson=null")
          must("const CATEGORY_LABELS={house:'House',car:'Car',money:'Money',activity:'Activity',general:'General'};", "const CATEGORY_LABELS={house:'House',car:'Car',money:'Money',activity:'Activity',general:'General',cleaning:'🧹 Cleaning'};\nconst CLEANING_PRESETS=[['Remove bedding',3],['Put bedding on',5],['Hoover upstairs',5],['Hoover stairs',4],['Hoover downstairs',5],['Dust upstairs',4],['Dust downstairs',4],['Mop downstairs',5],['Clean kitchen',7],['Clean bathroom',7],['Clean toilet',4],['Clean shower',6],['Change towels',3],['Empty bins',3],['Load dishwasher',3],['Empty dishwasher',3],['Tidy bedrooms',5],['Tidy lounge',5]];\nconst DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];\nfunction populateCleaningPresets(){if($('cleaningPreset').options.length>1)return;for(const [name,pts] of CLEANING_PRESETS){let o=document.createElement('option');o.value=name;o.textContent=name+' · '+pts+' pts';o.dataset.points=pts;$('cleaningPreset').appendChild(o)}}\nfunction nextWeekday(day,from=new Date(),includeToday=true){let d=new Date(from);d.setHours(12,0,0,0);let diff=(day-d.getDay()+7)%7;if(diff===0&&!includeToday)diff=7;d.setDate(d.getDate()+diff);return localDateKey(d)}\nfunction cleaningFrequencyText(t){if(t.repeat_rule==='weekly')return 'Weekly · '+DAY_NAMES[Number(t.repeat_day??parseLocalDate(t.due_date)?.getDay()??5)];if(t.repeat_rule&&t.repeat_rule!=='none')return t.repeat_rule.charAt(0).toUpperCase()+t.repeat_rule.slice(1);return ''}\nfunction renderCleaningPoints(){let el=$('cleaningPoints');if(!el)return;let totals={};for(const row of cleaningPointsLog)totals[row.person_id]=(totals[row.person_id]||0)+Number(row.points||0);let ordered=[...people].sort((a,b)=>{let o={Sarah:1,Dan:2,Milo:3};return (o[a.name]||99)-(o[b.name]||99)});el.innerHTML='<div class=\"cleaning-points-head\"><b>🧹 Cleaning points</b><span>All time</span></div><div class=\"cleaning-points-grid\">'+ordered.map(p=>'<div class=\"cleaning-person\"><b>'+(totals[p.id]||0)+'</b><span>'+esc(p.name)+'</span></div>').join('')+'</div>';el.className=selectedCategory==='cleaning'?'cleaning-points':'cleaning-points hidden'}")
          must("function categoryLabel(v){return CATEGORY_LABELS[v]||'General'}", "function categoryLabel(v){return CATEGORY_LABELS[v]||'General'}\nfunction isCleaningTask(t){return (t.category||'general')==='cleaning'||t.task_type==='cleaning'}")
          must("  document.querySelectorAll('#categoryFilter button').forEach(b=>{\n    b.className=b.dataset.category===selectedCategory?'active':'';\n    b.onclick=()=>{selectedCategory=b.dataset.category;render()}\n  })\n}", "  document.querySelectorAll('#categoryFilter button').forEach(b=>{\n    b.className=b.dataset.category===selectedCategory?'active':'';\n    b.onclick=()=>{selectedCategory=b.dataset.category;render()}\n  });\n  renderCleaningPoints();\n}")

          # Card rendering
          s=re.sub(r"function card\(t,draggable=false\)\{.*?\}\nasync function loadData\(\)", """function card(t,draggable=false){let p=person(t.owner_person_id),dueState=taskDueState(t),clean=isCleaningTask(t),classes='card'+(dueState==='overdue'?' overdue':'')+(clean?' cleaning-card':'');let dueChip='';if(t.due_date){let label='Due '+fmt(t.due_date);if(dueState==='overdue')label='Overdue · '+fmt(t.due_date);else if(dueState==='today')label='Due today';dueChip=`<span class=\"chip ${dueState}\">${label}</span>`}let freq=clean?cleaningFrequencyText(t):'';return `<article class=\"${classes}${draggable?' drag-enabled':''}\" data-id=\"${t.id}\">${draggable?'<button class=\"drag-handle\" type=\"button\" aria-label=\"Drag to reorder\">☰</button>':''}<div class=\"task-title-row\">${clean?'<span class=\"task-type-icon\" title=\"Cleaning\">🧹</span>':''}<h3>${esc(t.title)}</h3></div>${t.description?`<div class=\"desc\">${esc(t.description)}</div>`:''}<div class=\"chips\">${mode==='others'?`<span class=\"chip\">${esc(t.area)}</span>`:''}${p&&p.id!==mePerson.id?`<span class=\"chip\">${esc(p.name)}</span>`:''}${clean?`<span class=\"chip points-chip\">${Number(t.points||0)} pts</span>`:''}${dueChip}${t.area!=='work'&&selectedCategory==='all'?`<span class=\"chip category\">${categoryLabel(t.category||'general')}</span>`:''}${freq?`<span class=\"chip\">${esc(freq)}</span>`:(!clean&&t.repeat_rule!=='none'?`<span class=\"chip\">Repeats ${t.repeat_rule}</span>`:'')}${t.priority==='high'?'<span class=\"chip high\">High priority</span>':''}</div><div class=\"actions\"><button data-action=\"edit\">Edit</button>${t.status!=='todo'?'<button data-action=\"todo\">To do</button>':''}${t.status!=='progress'?'<button data-action=\"progress\">In progress</button>':''}${t.status!=='done'?'<button data-action=\"done\">Done</button>':''}</div></article>`}\nasync function loadData()""", s, count=1, flags=re.S)

          # Load cleaning ledger
          must("const [pp,tt,ev,sc,sl,mv]=await Promise.all([", "const [pp,tt,ev,sc,sl,mv,cp]=await Promise.all([")
          must("sb.from('movies').select('*').eq('household_id',householdId).order('created_at',{ascending:false})]);", "sb.from('movies').select('*').eq('household_id',householdId).order('created_at',{ascending:false}),sb.from('cleaning_points_log').select('*').eq('household_id',householdId).order('completed_at',{ascending:true})]);")
          must("movies=mv.error?[]:(mv.data||[]);mePerson=", "movies=mv.error?[]:(mv.data||[]);cleaningPointsLog=cp.error?[]:(cp.data||[]);mePerson=")
          must(".on('postgres_changes',{event:'*',schema:'public',table:'movies',filter:'household_id=eq.'+householdId},()=>loadData()).subscribe()", ".on('postgres_changes',{event:'*',schema:'public',table:'movies',filter:'household_id=eq.'+householdId},()=>loadData()).on('postgres_changes',{event:'*',schema:'public',table:'cleaning_points_log',filter:'household_id=eq.'+householdId},()=>loadData()).subscribe()")

          # Cleaning form behaviour
          s=re.sub(r"function updateCategoryVisibility\(\)\{.*?\}\nfunction openTask\(id\)\{.*?\}\nfunction closeModal", """function updateCategoryVisibility(){const isWork=$('area').value==='work';$('categoryField').className=isWork?'field hidden':'field';if(isWork)$('category').value='general';const clean=!isWork&&$('category').value==='cleaning';$('cleaningFields').className=clean?'cleaning-fields':'cleaning-fields hidden';if(clean){if($('cleaningRepeat').value==='weekly'&&!$('cleaningRepeatDay').value)$('cleaningRepeatDay').value='5';$('repeat').value=$('cleaningRepeat').value;$('cleaningRepeatDayField').className=$('cleaningRepeat').value==='weekly'?'field':'field hidden';if($('cleaningRepeat').value==='weekly'){let day=Number($('cleaningRepeatDay').value),current=$('due').value;if(!current||parseLocalDate(current).getDay()!==day)$('due').value=nextWeekday(day,new Date(),true)}}}\nfunction openTask(id){populateCleaningPresets();let t=tasks.find(x=>x.id===id),ownerId=t?t.owner_person_id:(mode==='others'?otherId:mePerson.id);$('modalTitle').textContent=t?'Edit task':'Add task';$('taskId').value=t?.id||'';$('title').value=t?.title||'';$('description').value=t?.description||'';$('area').value=t?.area||(mode==='me'?meArea:'personal');$('area').disabled=!t&&mode==='others';owners(ownerId);$('status').value=t?.status||'todo';$('due').value=t?.due_date||'';$('repeat').value=t?.repeat_rule||'none';$('category').value=t?.category||((t?.task_type==='cleaning')?'cleaning':'general');$('priority').value=t?.priority||'normal';$('cleaningPointsValue').value=t?.points||5;$('cleaningRepeat').value=(t?.repeat_rule&&t.repeat_rule!=='none')?t.repeat_rule:'weekly';$('cleaningRepeatDay').value=String(t?.repeat_day??5);$('cleaningPreset').value=CLEANING_PRESETS.some(x=>x[0]===t?.title)?t.title:'';updateCategoryVisibility();$('delete').className=t?'danger':'danger hidden';$('modal').className='modal'}\nfunction closeModal""", s, count=1, flags=re.S)

          # Recurrence carries cleaning metadata
          must("    sort_order:Number(task.sort_order)||nextTaskSortOrder()\n  };", "    sort_order:Number(task.sort_order)||nextTaskSortOrder(),\n    task_type:isCleaningTask(task)?'cleaning':'general',\n    points:isCleaningTask(task)?Number(task.points||0):0,\n    repeat_day:isCleaningTask(task)&&task.repeat_rule==='weekly'?(task.repeat_day??parseLocalDate(task.due_date)?.getDay()??5):null\n  };")

          # Award helper + save/update
          marker="function celebrate(){"
          helper="""async function awardCleaningPoints(task){if(!isCleaningTask(task)||Number(task.points||0)<=0)return true;let occurrence=task.due_date||todayKey();let r=await sb.from('cleaning_points_log').insert({household_id:householdId,task_id:task.id,person_id:task.owner_person_id,points:Number(task.points||0),occurrence_date:occurrence,completed_by:user.id});if(r.error&&r.error.code!=='23505'){notify('Could not award cleaning points: '+r.error.message);return false}return true}\n"""
          must(marker, helper+marker)
          s=re.sub(r"async function saveTask\(e\)\{.*?\}\nasync function updateStatus\(id,status\)\{.*?\}\nasync function removeTask", """async function saveTask(e){e.preventDefault();let id=$('taskId').value,previous=id?tasks.find(x=>x.id===id):null,owner=person($('owner').value),area=$('area').value,category=area==='work'?'general':($('category').value||'general'),clean=category==='cleaning';if(mode==='others'&&area==='work'){notify('Other people can only be given personal tasks');return}if(area==='work'&&owner.user_id!==user.id){notify('Work tasks can only be assigned to yourself');return}if(owner.name==='Milo'&&area==='work'){notify('Milo only has personal tasks');return}let repeat=clean?$('cleaningRepeat').value:$('repeat').value,repeatDay=clean&&repeat==='weekly'?Number($('cleaningRepeatDay').value):null,due=$('due').value||null;if(clean&&repeat==='weekly'&&(!due||parseLocalDate(due).getDay()!==repeatDay))due=nextWeekday(repeatDay,new Date(),true);let row={household_id:householdId,owner_person_id:owner.id,owner_user_id:owner.user_id||null,title:$('title').value.trim(),description:$('description').value.trim(),area,status:$('status').value,due_date:due,repeat_rule:repeat,category,priority:$('priority').value,monitoring:owner.id!==mePerson.id,task_type:clean?'cleaning':'general',points:clean?Number($('cleaningPointsValue').value||0):0,repeat_day:repeatDay};if(!id)row.sort_order=nextTaskSortOrder();let r=id?await sb.from('tasks').update(row).eq('id',id).select('*').single():await sb.from('tasks').insert(row).select('*').single();if(r.error){notify(r.error.message);return}let saved=r.data||{...previous,...row,id:id};closeModal();if(!id&&area==='personal'&&owner.user_id&&owner.user_id!==user.id)sendTaskAssignmentPush(saved.id);if(row.status==='done'&&(!previous||previous.status!=='done')){if(clean)await awardCleaningPoints(saved);try{await ensureNextOccurrence(saved)}catch(err){notify('Task completed, but the next repeat could not be created: '+err.message);await loadData();return}celebrate();completionVibration()}notify(id?'✓ Task updated':'✓ Task added');await loadData()}\nasync function updateStatus(id,status){let before=tasks.find(x=>x.id===id);let r=await sb.from('tasks').update({status}).eq('id',id);if(r.error)notify(r.error.message);else{if(status==='done'&&before&&before.status!=='done'){if(isCleaningTask(before))await awardCleaningPoints(before);try{let created=await ensureNextOccurrence(before);celebrate();completionVibration();notify(isCleaningTask(before)?'✓ Completed · '+Number(before.points||0)+' cleaning points':(created?'✓ Completed — next repeat added':'✓ Completed'))}catch(err){notify('Completed, but the next repeat could not be created: '+err.message)}}else notify('Task updated');await loadData()}}\nasync function removeTask""", s, count=1, flags=re.S)

          # Voice completion uses normal status path, so cleaning gets points too.
          s=s.replace("let result=await sb.from('tasks').update({status:'done'}).eq('id',t.id);if(!result.error){try{await ensureNextOccurrence(t)}catch(err){console.error('Could not create next repeating task',err)}hits.push(t.title)}", "await updateStatus(t.id,'done');hits.push(t.title)")

          # Event wiring
          must("$('area').addEventListener('change',updateCategoryVisibility);$('taskForm').onsubmit=saveTask", "$('area').addEventListener('change',updateCategoryVisibility);$('category').addEventListener('change',updateCategoryVisibility);$('cleaningRepeat').addEventListener('change',()=>{$('repeat').value=$('cleaningRepeat').value;updateCategoryVisibility()});$('cleaningRepeatDay').addEventListener('change',updateCategoryVisibility);$('cleaningPreset').addEventListener('change',()=>{let o=$('cleaningPreset').selectedOptions[0];if(o&&o.value){$('title').value=o.value;$('cleaningPointsValue').value=o.dataset.points||5}});$('taskForm').onsubmit=saveTask")

          s=s.replace('data-build="2.6-root-poster-fix"','data-build="2.7-cleaning-category"')
          path.write_text(s)
          print('Patched index.html', len(s))
          PY
      - name: Commit patch
        run: |
          git config user.name "OrganiseUs updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add cleaning category and points" || exit 0
          git push
