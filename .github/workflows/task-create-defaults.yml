name: OrganiseUs task create defaults
on:
  push:
    paths:
      - '.github/workflows/task-create-defaults.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update task create behaviour
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old_status='<label class="field"><span>Status</span><select id="status"><option value="todo">To do</option><option value="progress">In progress</option><option value="done">Done</option></select></label>'
          new_status='<label id="statusField" class="field"><span>Status</span><select id="status"><option value="todo">To do</option><option value="progress">In progress</option><option value="done">Done</option></select></label>'
          if old_status not in s:
              raise SystemExit('Status field not found')
          s=s.replace(old_status,new_status,1)

          old="function openTask(id){populateCleaningPresets();let t=tasks.find(x=>x.id===id),ownerId=t?t.owner_person_id:(mode==='others'?otherId:mePerson.id);$('modalTitle').textContent=t?'Edit task':'Add task';$('taskId').value=t?.id||'';$('title').value=t?.title||'';$('description').value=t?.description||'';$('area').value=t?.area||(mode==='me'?meArea:'personal');$('area').disabled=!t&&mode==='others';owners(ownerId);$('status').value=t?.status||'todo';$('due').value=t?.due_date||'';$('repeat').value=t?.repeat_rule||'none';$('category').value=(t?.category==='activity'?'general':(t?.category||((t?.task_type==='cleaning')?'cleaning':'general')));$('priority').value=t?.priority||'normal';$('cleaningRepeat').value=(t?.repeat_rule&&t.repeat_rule!=='none')?t.repeat_rule:'weekly';$('cleaningRepeatDay').value=String(t?.repeat_day??5);$('cleaningPreset').value=CLEANING_PRESETS.some(x=>x[1]===t?.title)?t.title:'';updateCategoryVisibility();$('delete').className=t?'danger':'danger hidden';$('modal').className='modal'}"
          new="function openTask(id){populateCleaningPresets();let t=tasks.find(x=>x.id===id),ownerId=t?t.owner_person_id:(mode==='others'?otherId:mePerson.id),defaultCategory=!t&&['house','car','money','general','cleaning'].includes(selectedCategory)?selectedCategory:'general';$('modalTitle').textContent=t?'Edit task':'Add task';$('taskId').value=t?.id||'';$('title').value=t?.title||'';$('description').value=t?.description||'';$('area').value=t?.area||(mode==='me'?meArea:'personal');$('area').disabled=!t&&mode==='others';owners(ownerId);$('status').value=t?.status||'todo';$('statusField').className=t?'field':'field hidden';$('due').value=t?.due_date||'';$('repeat').value=t?.repeat_rule||'none';$('category').value=t?(t.category==='activity'?'general':(t.category||((t.task_type==='cleaning')?'cleaning':'general'))):defaultCategory;$('priority').value=t?.priority||'normal';$('cleaningRepeat').value=(t?.repeat_rule&&t.repeat_rule!=='none')?t.repeat_rule:'weekly';$('cleaningRepeatDay').value=String(t?.repeat_day??5);$('cleaningPreset').value=CLEANING_PRESETS.some(x=>x[1]===t?.title)?t.title:'';updateCategoryVisibility();$('delete').className=t?'danger':'danger hidden';$('modal').className='modal'}"
          if old not in s:
              raise SystemExit('openTask function not found')
          s=s.replace(old,new,1)

          s=s.replace('data-build="3.5-cleaning-always-personal"','data-build="3.6-task-create-defaults"')
          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>')[-1].split('</script>',1)[0]
          Path('/tmp/organiseus-app.js').write_text(js)
          PY
          node --check /tmp/organiseus-app.js

      - name: Commit
        run: |
          git config user.name "OrganiseUs updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Improve new task defaults" || exit 0
          git push
