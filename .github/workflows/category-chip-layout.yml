name: OrganiseUs category chip layout
on:
  push:
    paths:
      - '.github/workflows/category-chip-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          def rep(old,new,count=-1):
              global s
              if old not in s:
                  raise SystemExit('Missing expected text: '+old[:140])
              s=s.replace(old,new,count)

          # Five category buttons, one row, no horizontal scrolling.
          rep('.category-filter{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.category-filter::-webkit-scrollbar{display:none}.category-filter button{flex:0 0 auto;border:1px solid #d8d4df;background:#fff;border-radius:999px;padding:7px 11px;font-size:12px;color:#5f5968}',
              '.category-filter{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:2px 0 8px;width:100%;overflow:visible}.category-filter button{min-width:0;width:100%;border:1px solid #d8d4df;background:#fff;border-radius:999px;padding:7px 4px;font-size:11px;color:#5f5968;white-space:nowrap;overflow:hidden;text-overflow:clip}')

          # Remove All chip.
          rep('<button data-category="all" class="active">All</button>','',1)

          # Tapping an active category clears the filter back to all.
          old="b.onclick=()=>{selectedCategory=b.dataset.category;render()}"
          new="b.onclick=()=>{selectedCategory=selectedCategory===b.dataset.category?'all':b.dataset.category;render()}"
          rep(old,new,1)

          # Smaller still on narrow phones so all five remain visible.
          rep('@media(max-width:420px){.userbar{gap:5px}', '@media(max-width:420px){.category-filter{gap:3px}.category-filter button{padding:7px 2px;font-size:10px}.userbar{gap:5px}',1)

          s=s.replace('data-build="2.9-category-icons"','data-build="3.0-category-toggle-row"')
          p.write_text(s)
          print('Patched',len(s))
          PY
      - name: Commit
        run: |
          git config user.name "OrganiseUs updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fit category filters on one row" || exit 0
          git push
