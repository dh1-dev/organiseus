name: Car tasks personal only
on:
  push:
    paths:
      - '.github/workflows/car-personal-only.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide area for car tasks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function updateCategoryVisibility(){const selectedClean=$('category').value==='cleaning';if(selectedClean)$('area').value='personal';const isWork=$('area').value==='work';$('categoryField').className=isWork?'field hidden':'field';if(isWork)$('category').value='general';if($('category').value==='activity')$('category').value='general';const clean=!isWork&&$('category').value==='cleaning',car=!isWork&&$('category').value==='car';if(car){let dan=people.find(p=>(p.name||'').trim().toLowerCase()==='dan');if(dan)$('owner').value=dan.id}$('ownerField').className=car?'field hidden':'field';$('areaField').className=clean?'field hidden':'field';$('titleField').className=clean?'field hidden':'field';$('title').required=!clean;$('repeatField').className=clean?'field hidden':'field';$('cleaningFields').className=clean?'cleaning-fields':'cleaning-fields hidden';if(clean){let cleaningRule=$('cleaningRepeat').value||'none';$('repeat').value=cleaningRule;if(cleaningRule==='weekly'&&!$('cleaningRepeatDay').value)$('cleaningRepeatDay').value='5';$('cleaningRepeatDayField').className=cleaningRule==='weekly'?'field':'field hidden';if(cleaningRule==='weekly'){let day=Number($('cleaningRepeatDay').value),current=$('due').value;if(!current||parseLocalDate(current).getDay()!==day)$('due').value=nextWeekday(day,new Date(),true)}}else{$('cleaningRepeatDayField').className='field hidden'}}"
          new="function updateCategoryVisibility(){const selectedPersonalOnly=['cleaning','car'].includes($('category').value);if(selectedPersonalOnly)$('area').value='personal';const isWork=$('area').value==='work';$('categoryField').className=isWork?'field hidden':'field';if(isWork)$('category').value='general';if($('category').value==='activity')$('category').value='general';const clean=!isWork&&$('category').value==='cleaning',car=!isWork&&$('category').value==='car';if(car){let dan=people.find(p=>(p.name||'').trim().toLowerCase()==='dan');if(dan)$('owner').value=dan.id}$('ownerField').className=car?'field hidden':'field';$('areaField').className=(clean||car)?'field hidden':'field';$('titleField').className=clean?'field hidden':'field';$('title').required=!clean;$('repeatField').className=clean?'field hidden':'field';$('cleaningFields').className=clean?'cleaning-fields':'cleaning-fields hidden';if(clean){let cleaningRule=$('cleaningRepeat').value||'none';$('repeat').value=cleaningRule;if(cleaningRule==='weekly'&&!$('cleaningRepeatDay').value)$('cleaningRepeatDay').value='5';$('cleaningRepeatDayField').className=cleaningRule==='weekly'?'field':'field hidden';if(cleaningRule==='weekly'){let day=Number($('cleaningRepeatDay').value),current=$('due').value;if(!current||parseLocalDate(current).getDay()!==day)$('due').value=nextWeekday(day,new Date(),true)}}else{$('cleaningRepeatDayField').className='field hidden'}}"
          if old not in s:
              raise SystemExit('Current category visibility function not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>')[-1].split('</script>',1)[0]
          Path('/tmp/organiseus-app.js').write_text(js)
          PY
          node --check /tmp/organiseus-app.js
      - name: Commit
        run: |
          git config user.name "OrganiseUs updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Make car tasks personal only" || exit 0
          git push
