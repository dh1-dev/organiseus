name: Update OrganiseUs cleaning list
on:
  push:
    paths:
      - '.github/workflows/update-cleaning-search.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cleaning presets and search
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old_html='<label class="field"><span>Cleaning task</span><select id="cleaningPreset"><option value="">Choose a task…</option></select></label>'
          new_html='<label class="field"><span>Cleaning task</span><input id="cleaningPreset" list="cleaningTaskOptions" placeholder="Search cleaning tasks…" autocomplete="off"><datalist id="cleaningTaskOptions"></datalist></label>'
          if old_html not in s: raise SystemExit('Cleaning task selector not found')
          s=s.replace(old_html,new_html,1)

          start=s.index('const CLEANING_PRESETS=')
          end=s.index(';\nconst DAY_NAMES=',start)+1
          presets="const CLEANING_PRESETS=[['🧺','Change towels'],['🛁','Clean bathrooms'],['☕','Clean coffee machine'],['🧽','Clean kitchen floor'],['🧽','Clean kitchen sides'],['🚿','Clean shower'],['🪟','Clean windows'],['🌱','Cut grass'],['🧺','Do washing'],['🪶','Dust downstairs'],['🪵','Dust skirting'],['🪶','Dust upstairs'],['🗑️','Empty bins'],['🍽️','Empty dishwasher'],['🧹','Hoover downstairs'],['🧹','Hoover stairs'],['🧹','Hoover upstairs'],['🍽️','Load dishwasher'],['🛏️','Put bedding on'],['🧸','Put toys away'],['👕','Put washing away'],['🛏️','Remove bedding'],['🧴','Shampoo carpet stains'],['🛋️','Shampoo sofa'],['🧸','Tidy bedrooms'],['🛋️','Tidy lounge']]"
          s=s[:start]+presets+s[end:]

          old_fn="function populateCleaningPresets(){if($('cleaningPreset').options.length>1)return;for(const [icon,name] of CLEANING_PRESETS){let o=document.createElement('option');o.value=name;o.textContent=icon+' '+name;$('cleaningPreset').appendChild(o)}}"
          new_fn="function populateCleaningPresets(){let list=$('cleaningTaskOptions');if(list.children.length)return;for(const [icon,name] of CLEANING_PRESETS){let o=document.createElement('option');o.value=name;o.label=icon+' '+name;list.appendChild(o)}}"
          if old_fn not in s: raise SystemExit('Preset population function not found')
          s=s.replace(old_fn,new_fn,1)

          old_open="$('cleaningPreset').value=CLEANING_PRESETS.some(x=>x[1]===t?.title)?t.title:'';"
          new_open="$('cleaningPreset').value=CLEANING_PRESETS.some(x=>x[1]===t?.title)?t.title:'';"
          if old_open not in s: raise SystemExit('Cleaning preset edit state not found')

          old_event="$('cleaningPreset').addEventListener('change',()=>{let o=$('cleaningPreset').selectedOptions[0];if(o&&o.value)$('title').value=o.value});"
          new_event="$('cleaningPreset').addEventListener('change',()=>{let v=$('cleaningPreset').value.trim();if(CLEANING_PRESETS.some(x=>x[1]===v))$('title').value=v});"
          if old_event not in s: raise SystemExit('Cleaning preset handler not found')
          s=s.replace(old_event,new_event,1)

          s=s.replace('data-build="3.1.1-cleaning-presets-icons-fix"','data-build="3.2-searchable-cleaning-list"')
          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          scripts=s.split('<script>')
          if len(scripts)<2: raise SystemExit('Inline app script not found')
          js=scripts[-1].split('</script>',1)[0]
          Path('/tmp/organiseus-app.js').write_text(js)
          PY
          node --check /tmp/organiseus-app.js

      - name: Commit
        run: |
          git config user.name "OrganiseUs updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Update searchable cleaning task list" || exit 0
          git push
