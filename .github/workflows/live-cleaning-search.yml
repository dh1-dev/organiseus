name: Live cleaning search
on:
  push:
    paths:
      - '.github/workflows/live-cleaning-search.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add live filtered cleaning suggestions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old_html='<label class="field"><span>Cleaning task</span><input id="cleaningPreset" list="cleaningTaskOptions" placeholder="Search cleaning tasks…" autocomplete="off"><datalist id="cleaningTaskOptions"></datalist></label>'
          new_html='<label class="field cleaning-search-field"><span>Cleaning task</span><input id="cleaningPreset" placeholder="Search cleaning tasks…" autocomplete="off"><div id="cleaningTaskOptions" class="cleaning-suggestions hidden"></div></label>'
          if old_html not in s: raise SystemExit('Cleaning task search field not found')
          s=s.replace(old_html,new_html,1)

          css_anchor='.cleaning-fields .field{margin-top:0}.cleaning-hint{grid-column:1/-1;font-size:11px;color:#6d6575}'
          css_new='.cleaning-fields .field{margin-top:0}.cleaning-search-field{position:relative}.cleaning-suggestions{position:absolute;left:0;right:0;top:100%;z-index:35;background:#fff;border:1px solid #cfc7da;border-radius:10px;box-shadow:0 8px 22px #0002;max-height:240px;overflow:auto;margin-top:4px;padding:4px}.cleaning-suggestion{display:flex;width:100%;align-items:center;gap:8px;text-align:left;border:0;background:#fff;border-radius:8px;padding:9px 10px}.cleaning-suggestion:active,.cleaning-suggestion:hover{background:#f0e9f9}.cleaning-suggestion-icon{width:24px;text-align:center;font-size:18px;flex:0 0 auto}.cleaning-suggestion-name{font-size:13px;color:#302938}.cleaning-hint{grid-column:1/-1;font-size:11px;color:#6d6575}'
          if css_anchor not in s: raise SystemExit('Cleaning CSS anchor not found')
          s=s.replace(css_anchor,css_new,1)

          old_fn="function populateCleaningPresets(){let list=$('cleaningTaskOptions');if(list.children.length)return;for(const [icon,name] of CLEANING_PRESETS){let o=document.createElement('option');o.value=name;o.label=icon+' '+name;list.appendChild(o)}}"
          new_fn="function populateCleaningPresets(){renderCleaningSuggestions('')}\nfunction renderCleaningSuggestions(query){let box=$('cleaningTaskOptions');if(!box)return;let q=(query||'').trim().toLowerCase();let matches=CLEANING_PRESETS.filter(([,name])=>!q||name.toLowerCase().includes(q));box.innerHTML=matches.length?matches.map(([icon,name])=>`<button type=\"button\" class=\"cleaning-suggestion\" data-cleaning-task=\"${esc(name)}\"><span class=\"cleaning-suggestion-icon\">${icon}</span><span class=\"cleaning-suggestion-name\">${esc(name)}</span></button>`).join(''):'<div class=\"empty\">No matching cleaning tasks</div>';box.className='cleaning-suggestions';box.querySelectorAll('[data-cleaning-task]').forEach(b=>b.onclick=()=>{let name=b.dataset.cleaningTask;$('cleaningPreset').value=name;$('title').value=name;hideCleaningSuggestions()})}\nfunction hideCleaningSuggestions(){let box=$('cleaningTaskOptions');if(box)box.className='cleaning-suggestions hidden'}"
          if old_fn not in s: raise SystemExit('Old cleaning preset function not found')
          s=s.replace(old_fn,new_fn,1)

          old_event="$('cleaningPreset').addEventListener('change',()=>{let v=$('cleaningPreset').value.trim();if(CLEANING_PRESETS.some(x=>x[1]===v))$('title').value=v});"
          new_event="$('cleaningPreset').addEventListener('input',()=>renderCleaningSuggestions($('cleaningPreset').value));$('cleaningPreset').addEventListener('focus',()=>renderCleaningSuggestions($('cleaningPreset').value));$('cleaningPreset').addEventListener('blur',()=>setTimeout(hideCleaningSuggestions,180));$('cleaningPreset').addEventListener('change',()=>{let v=$('cleaningPreset').value.trim();if(CLEANING_PRESETS.some(x=>x[1]===v))$('title').value=v});"
          if old_event not in s: raise SystemExit('Old cleaning preset event not found')
          s=s.replace(old_event,new_event,1)

          s=s.replace('data-build="3.3-expanded-cleaning-list"','data-build="3.4-live-cleaning-search"')
          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>')[-1].split('</script>',1)[0]
          Path('/tmp/organiseus-app.js').write_text(js)
          PY
          node --check /tmp/organiseus-app.js

      - name: Commit
        run: |
          git config user.name "OrganiseUs updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Make cleaning task search filter live" || exit 0
          git push
