name: Car tasks owner Dan
on:
  push:
    paths:
      - '.github/workflows/car-owner-dan.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide owner for car tasks and force Dan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old_owner='<label class="field"><span>Owner</span><select id="owner"></select></label>'
          new_owner='<label id="ownerField" class="field"><span>Owner</span><select id="owner"></select></label>'
          if old_owner not in s:
              raise SystemExit('Owner field not found')
          s=s.replace(old_owner,new_owner,1)

          old_vis="function updateCategoryVisibility(){const selectedClean=$('category').value==='cleaning';if(selectedClean)$('area').value='personal';const isWork=$('area').value==='work';$('categoryField').className=isWork?'field hidden':'field';if(isWork)$('category').value='general';if($('category').value==='activity')$('category').value='general';const clean=!isWork&&$('category').value==='cleaning';$('areaField').className=clean?'field hidden':'field';$('titleField').className=clean?'field hidden':'field';$('title').required=!clean;$('repeatField').className=clean?'field hidden':'field';$('cleaningFields').className=clean?'cleaning-fields':'cleaning-fields hidden';if(clean){let cleaningRule=$('cleaningRepeat').value||'none';$('repeat').value=cleaningRule;if(cleaningRule==='weekly'&&!$('cleaningRepeatDay').value)$('cleaningRepeatDay').value='5';$('cleaningRepeatDayField').className=cleaningRule==='weekly'?'field':'field hidden';if(cleaningRule==='weekly'){let day=Number($('cleaningRepeatDay').value),current=$('due').value;if(!current||parseLocalDate(current).getDay()!==day)$('due').value=nextWeekday(day,new Date(),true)}}else{$('cleaningRepeatDayField').className='field hidden'}}"
          new_vis="function updateCategoryVisibility(){const selectedClean=$('category').value==='cleaning';if(selectedClean)$('area').value='personal';const isWork=$('area').value==='work';$('categoryField').className=isWork?'field hidden':'field';if(isWork)$('category').value='general';if($('category').value==='activity')$('category').value='general';const clean=!isWork&&$('category').value==='cleaning',car=!isWork&&$('category').value==='car';if(car){let dan=people.find(p=>(p.name||'').trim().toLowerCase()==='dan');if(dan)$('owner').value=dan.id}$('ownerField').className=car?'field hidden':'field';$('areaField').className=clean?'field hidden':'field';$('titleField').className=clean?'field hidden':'field';$('title').required=!clean;$('repeatField').className=clean?'field hidden':'field';$('cleaningFields').className=clean?'cleaning-fields':'cleaning-fields hidden';if(clean){let cleaningRule=$('cleaningRepeat').value||'none';$('repeat').value=cleaningRule;if(cleaningRule==='weekly'&&!$('cleaningRepeatDay').value)$('cleaningRepeatDay').value='5';$('cleaningRepeatDayField').className=cleaningRule==='weekly'?'field':'field hidden';if(cleaningRule==='weekly'){let day=Number($('cleaningRepeatDay').value),current=$('due').value;if(!current||parseLocalDate(current).getDay()!==day)$('due').value=nextWeekday(day,new Date(),true)}}else{$('cleaningRepeatDayField').className='field hidden'}}"
          if old_vis not in s:
              raise SystemExit('Category visibility function not found')
          s=s.replace(old_vis,new_vis,1)

          old_save="async function saveTask(e){e.preventDefault();let id=$('taskId').value,previous=id?tasks.find(x=>x.id===id):null,owner=person($('owner').value),area=$('area').value,category=area==='work'?'general':($('category').value||'general'),clean=category==='cleaning';"
          new_save="async function saveTask(e){e.preventDefault();let id=$('taskId').value,previous=id?tasks.find(x=>x.id===id):null,owner=person($('owner').value),area=$('area').value,category=area==='work'?'general':($('category').value||'general'),clean=category==='cleaning',car=category==='car';if(car){let dan=people.find(p=>(p.name||'').trim().toLowerCase()==='dan');if(!dan){notify('Dan could not be found');return}owner=dan;area='personal'}"
          if old_save not in s:
              raise SystemExit('saveTask start not found')
          s=s.replace(old_save,new_save,1)

          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>')[-1].split('</script>',1)[0]
          Path('/tmp/organiseus-app.js').write_text(js)
          PY
          node --check /tmp/organiseus-app.js

      - name: Commit
        run: |
          git config user.name "OrganiseUs updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Assign car tasks to Dan" || exit 0
          git push
