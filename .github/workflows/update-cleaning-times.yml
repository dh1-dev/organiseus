name: Update cleaning estimates
on:
  push:
    paths:
      - '.github/workflows/update-cleaning-times.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cleaning estimates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements={
            "['☕','Clean coffee machine','10 min']":"['☕','Clean coffee machine','45 min']",
            "['🧽','Clean kitchen door fronts','20 min']":"['🧽','Clean kitchen door fronts','10 min']",
            "['🧹','Hoover downstairs','20 min']":"['🧹','Hoover downstairs','10 min']",
            "['🧹','Hoover stairs','10 min']":"['🧹','Hoover stairs','5 min']",
            "['🧹','Hoover upstairs','20 min']":"['🧹','Hoover upstairs','10 min']",
            "['🧴','Shampoo carpet stains','15 min']":"['🧴','Shampoo carpet stains','20 min']",
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'Missing expected preset: {old}')
            s=s.replace(old,new,1)
          s=s.replace('data-build="3.9-cleaning-estimated-times"','data-build="4.0-cleaning-estimates-corrected"')
          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>')[-1].split('</script>',1)[0]
          Path('/tmp/organiseus-app.js').write_text(js)
          PY
          node --check /tmp/organiseus-app.js
      - name: Commit
        run: |
          git config user.name "OrganiseUs updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Correct cleaning task estimates" || exit 0
          git push
